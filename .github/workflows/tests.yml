name: Research tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python research.py --mode offline --out research_report.json
      - run: python quant.py --out quant_report.json --html quant_report.html
      - run: python benchmark.py --out benchmark_results.json --markdown docs/BENCHMARK.md
